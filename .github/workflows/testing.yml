name: Docker Test

on:
  push:
    branches:
      - main

jobs:
  docker-tests:
    name: Run Docker Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Run Docker container
        run: |
          docker run -d --name testcontainer alpine tail -f /dev/null

      - name: Run tests
        run: |
          docker exec testcontainer /bin/sh -c "
            echo 'Iniciando pruebas en el contenedor...';
            cd /home
            mkdir sebas
            cd sebas
            printf 'Archivo de prueba generado por Sebastian.\nValidación de entorno exitosa.\n' > test.txt
            cat test.txt
            ls -la || exit 1
          "
